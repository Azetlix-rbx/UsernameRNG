# Сборка приложения-упаковщика (папка packer-app). Готовый APK: Releases, метка packer-latest.
name: Build Packer App

on:
  push:
    branches: [main, master]
    paths:
      - 'packer-app/**'
      - '.github/workflows/packer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || echo "sdkmanager skipped"

      - name: Build APK
        working-directory: packer-app
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Collect APK
        run: |
          mkdir -p out
          cp packer-app/app/build/outputs/apk/debug/app-debug.apk out/Packer.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: packer-apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete packer-latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create packer-latest out/Packer.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Упаковщик APK (сборка № $GITHUB_RUN_NUMBER)" --notes "Скачай файл Packer.apk ниже, в разделе Assets."
