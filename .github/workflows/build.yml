# Сборка usernameRNG в APK. Нужны файлы в корне репозитория:
# index.html, MainActivity.java, icons.txt
# Готовый APK появляется в Releases (метка apk-latest).
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || echo "sdkmanager skipped"

      - name: Assemble project
        run: |
          mkdir -p app/src/main/java/com/tgrng/app app/src/main/assets app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cp index.html app/src/main/assets/index.html
          cp MainActivity.java app/src/main/java/com/tgrng/app/MainActivity.java
          while read -r name b64; do
            name="$(printf '%s' "$name" | tr -d '\r')"
            b64="$(printf '%s' "$b64" | tr -d '\r ')"
            if [ -n "$name" ] && [ -n "$b64" ]; then printf '%s' "$b64" | base64 -d > "app/src/main/res/mipmap-xxxhdpi/$name"; fi
          done < icons.txt
          cat > settings.gradle <<'HEREDOC_END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TgRng"
          include ':app'
          HEREDOC_END
          cat > build.gradle <<'HEREDOC_END'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          HEREDOC_END
          cat > gradle.properties <<'HEREDOC_END'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          HEREDOC_END
          cat > app/build.gradle <<'HEREDOC_END'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tgrng.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.tgrng.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  debug {
                      storeFile rootProject.file('app.keystore')
                      storePassword 'android'
                      keyAlias 'luaapp'
                      keyPassword 'android'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
              }
          }
          HEREDOC_END
          cat > app/src/main/AndroidManifest.xml <<'HEREDOC_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          HEREDOC_END
          cat > app/src/main/res/values/strings.xml <<'HEREDOC_END'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">usernameRNG</string>
          </resources>
          HEREDOC_END
          cat > app/src/main/res/values/colors.xml <<'HEREDOC_END'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_background">#031A31</color>
          </resources>
          HEREDOC_END
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'HEREDOC_END'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          HEREDOC_END
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'HEREDOC_END'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          HEREDOC_END

      - name: Signing key
        run: |
          if [ ! -f app.keystore ]; then
            keytool -genkeypair -keystore app.keystore -storepass android -keypass android -alias luaapp -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App, O=App, C=RU"
            git config user.name "build"
            git config user.email "build@users.noreply.github.com"
            git add app.keystore
            git commit -m "Signing key" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Build APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/usernameRNG.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create apk-latest out/usernameRNG.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "usernameRNG (сборка № $GITHUB_RUN_NUMBER)" --notes "Скачай файл usernameRNG.apk ниже, в разделе Assets."
