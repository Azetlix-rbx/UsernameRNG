plugins {
    id 'com.android.application'
}

android {
    namespace 'com.packer.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.packer.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('app.keystore')
            storePassword 'android'
            keyAlias 'luaapp'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
